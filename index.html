<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Drives Pack Logger</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0f172a;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            color: var(--accent-green);
            margin: 0;
            font-size: 24px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 2px solid transparent;
        }

        .nav-btn.active {
            color: var(--accent-green);
            border-bottom-color: var(--accent-green);
        }

        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .submit-btn {
            width: 100%;
            background-color: var(--accent-green);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .submit-btn:hover {
            background-color: var(--accent-green-hover);
        }

        .card-row {
            margin-bottom: 10px;
            padding: 10px;
            background-color: var(--input-bg);
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .stat-card {
            background-color: var(--input-bg);
            border: 1px solid var(--panel-border);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--panel-border);
        }

        th {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 class="title">Top Drives Pack Logger</h1>
        <div id="dbStatus" style="color: var(--accent-green); font-size: 12px;">Database Connected</div>
    </div>

    <div class="nav-tabs">
        <button class="nav-btn active" onclick="switchTab('logger')">Pack Logger</button>
        <button class="nav-btn" onclick="switchTab('stats')">Drop Rate Statistics</button>
    </div>

    <!-- TAB 1: LOGGER -->
    <div id="loggerTab" class="tab-content active">
        <div class="grid-container">
            <div class="panel">
                <h3>Log New Pack Opening</h3>
                <form id="packForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>Date Pulled</label>
                            <input type="date" id="datePulled" required>
                        </div>
                        <div class="form-group">
                            <label>Pack Count (N)</label>
                            <input type="number" id="packCount" value="1" min="1" required>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <div class="form-group">
                            <label>Pack Type</label>
                            <select id="packType">
                                <option value="Ceramic">Ceramic</option>
                                <option value="Aluminium">Aluminium</option>
                                <option value="Steel">Steel</option>
                                <option value="Plastic">Plastic</option>
                                <option value="Carbon Fiber">Carbon Fiber</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Pack Subtype / Flavour</label>
                            <input type="text" id="packSubtype" placeholder="e.g. Regular or Cadillac Premium">
                        </div>
                    </div>

                    <h4>Cards Revealed (Lowest to Highest RQ)</h4>
                    <div id="cardsInputsContainer">
                        <!-- Dynamic Card Inputs Generated Here -->
                    </div>

                    <button type="submit" class="submit-btn">Submit Entire Pack</button>
                </form>
            </div>

            <div class="panel">
                <h3>Recent Logged Pulls</h3>
                <table>
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>PACK</th>
                            <th>SUBTYPE</th>
                            <th>CAR</th>
                            <th>RQ</th>
                            <th>RARITY</th>
                            <th>TOP SLOT</th>
                        </tr>
                    </thead>
                    <tbody id="recentPullsTable">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- TAB 2: DROP RATE STATS -->
    <div id="statsTab" class="tab-content">
        <div class="panel">
            <h3>Drop Rate Statistics (Official Top Slots Only)</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                <div class="stat-card">
                    <label>Total Packs Opened</label>
                    <h2 id="statTotalPacks">0</h2>
                </div>
                <div class="stat-card">
                    <label>Total Top Slots Evaluated</label>
                    <h2 id="statTopSlots">0</h2>
                </div>
            </div>

            <div id="rarityBreakdown">
                <!-- Calculated Rarity Statistics -->
            </div>
        </div>
    </div>

    <script>
        // Supabase Client Config (Replace with your actual URL and Key)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
        const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Set Default Date to Today
        document.getElementById('datePulled').valueAsDate = new Date();

        // Dynamically Generate Card Input Fields
        function renderCardInputs(count = 5) {
            const container = document.getElementById('cardsInputsContainer');
            container.innerHTML = '';
            for (let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="card-row">
                        <label>Card ${i}</label>
                        <input type="text" placeholder="Car Name" class="car-name" required style="margin-bottom: 5px;">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                            <input type="number" placeholder="RQ" class="car-rq" required>
                            <select class="car-rarity">
                                <option value="Common">Common</option>
                                <option value="Uncommon">Uncommon</option>
                                <option value="Rare">Rare</option>
                                <option value="Super Rare">Super Rare</option>
                                <option value="Ultra Rare">Ultra Rare</option>
                                <option value="Epic">Epic</option>
                                <option value="Legendary">Legendary</option>
                            </select>
                        </div>
                    </div>
                `;
            }
        }
        renderCardInputs(5);

        // Tab Switcher
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            if (tab === 'logger') {
                document.getElementById('loggerTab').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('statsTab').classList.add('active');
                event.target.classList.add('active');
                loadStatistics();
            }
        }

        // Form Submission Logic with Top Slot Calculation (C - N + 1)
        document.getElementById('packForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const datePulled = document.getElementById('datePulled').value;
            const packCount = parseInt(document.getElementById('packCount').value) || 1;
            const packType = document.getElementById('packType').value;
            const packSubtype = document.getElementById('packSubtype').value.trim() || 'Regular';
            const isRegular = packSubtype.toLowerCase() === 'regular';

            const cardNames = Array.from(document.querySelectorAll('.car-name')).map(i => i.value);
            const cardRqs = Array.from(document.querySelectorAll('.car-rq')).map(i => parseInt(i.value));
            const cardRarities = Array.from(document.querySelectorAll('.car-rarity')).map(i => i.value);

            const totalCards = cardNames.length;
            const topSlotStartIndex = totalCards - packCount + 1; // Formula: C - N + 1

            const recordsToInsert = cardNames.map((name, index) => {
                const slotNumber = index + 1;
                const isTopSlot = slotNumber >= topSlotStartIndex;

                return {
                    date_pulled: datePulled,
                    pack_type: packType,
                    pack_subtype: packSubtype,
                    car_name: name,
                    rq: cardRqs[index],
                    rarity: cardRarities[index],
                    slot_number: slotNumber,
                    is_top_slot: isTopSlot,
                    is_regular_pack: isRegular
                };
            });

            const { data, error } = await supabase.from('pack_pulls').insert(recordsToInsert);

            if (error) {
                alert('Error saving pack: ' + error.message);
            } else {
                alert('Pack logged successfully!');
                document.getElementById('packForm').reset();
                document.getElementById('datePulled').valueAsDate = new Date();
                renderCardInputs(5);
                loadRecentPulls();
            }
        });

        // Load Recent Logged Pulls
        async function loadRecentPulls() {
            const { data, error } = await supabase
                .from('pack_pulls')
                .select('*')
                .order('id', { ascending: false })
                .limit(10);

            if (error) return;

            const tbody = document.getElementById('recentPullsTable');
            tbody.innerHTML = '';
            data.forEach(pull => {
                tbody.innerHTML += `
                    <tr>
                        <td>${pull.date_pulled}</td>
                        <td>${pull.pack_type}</td>
                        <td>${pull.pack_subtype}</td>
                        <td>${pull.car_name}</td>
                        <td>${pull.rq}</td>
                        <td>${pull.rarity}</td>
                        <td>${pull.is_top_slot ? 'YES' : 'NO'}</td>
                    </tr>
                `;
            });
        }

        // Load Drop Rate Statistics Filtered by Top Slots & Regular Packs
        async function loadStatistics() {
            const { data, error } = await supabase
                .from('pack_pulls')
                .select('*')
                .eq('is_top_slot', true)
                .eq('is_regular_pack', true);

            if (error) return;

            const totalTopSlots = data.length;
            document.getElementById('statTopSlots').innerText = totalTopSlots;

            const rarities = ['Legendary', 'Epic', 'Ultra Rare', 'Super Rare', 'Rare', 'Uncommon', 'Common'];
            const container = document.getElementById('rarityBreakdown');
            container.innerHTML = '';

            rarities.forEach(rarity => {
                const count = data.filter(p => p.rarity === rarity).length;
                const percentage = totalTopSlots > 0 ? ((count / totalTopSlots) * 100).toFixed(1) : '0.0';

                container.innerHTML += `
                    <div class="stat-card" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>${rarity}</span>
                        <span><strong>${count} pulled</strong> (${percentage}%)</span>
                    </div>
                `;
            });
        }

        // Initial Load
        loadRecentPulls();
    </script>
</body>
</html>
