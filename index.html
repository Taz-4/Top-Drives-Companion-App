    <script>
        const SUPABASE_URL = "https://rsoiigloqrnxxfjnaxwz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_hwRaYHIp6HAYIUO9HKawSQ_k7eV0pUq";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('date-pulled').valueAsDate = new Date();

        let activeSlotsData = [];

        const OFFICIAL_ODDS = {
            'Plastic': { 'Rare': 1.50, 'Uncommon': 68.50, 'Common': 30.00 },
            'Steel': { 'Super Rare': 1.00, 'Rare': 37.50, 'Uncommon': 61.50 },
            'Aluminium': { 'Ultra Rare': 1.50, 'Super Rare': 18.50, 'Rare': 80.00 },
            'Ceramic': { 'Legendary': 0.65, 'Epic': 2.50, 'Ultra Rare': 14.00, 'Super Rare': 82.85 },
            'Carbon Fiber': { 'Legendary': 2.50, 'Epic': 17.75, 'Ultra Rare': 79.75 }
        };

        function getRarityClass(rarity) {
            const r = (rarity || '').toLowerCase();
            if (r.includes('legendary')) return { text: 'rarity-legendary', badge: 'badge-legendary' };
            if (r.includes('epic')) return { text: 'rarity-epic', badge: 'badge-epic' };
            if (r.includes('ultra rare')) return { text: 'rarity-ultra-rare', badge: 'badge-ultra-rare' };
            if (r.includes('super rare')) return { text: 'rarity-super-rare', badge: 'badge-super-rare' };
            if (r.includes('rare')) return { text: 'rarity-rare', badge: 'badge-rare' };
            if (r.includes('uncommon')) return { text: 'rarity-uncommon', badge: 'badge-uncommon' };
            if (r.includes('common')) return { text: 'rarity-common', badge: 'badge-common' };
            return { text: 'text-slate-400', badge: 'bg-slate-800 text-slate-400' };
        }
function toggleFlavourField() {
const regular = document.getElementById('regular-pack').value;
const container = document.getElementById('flavour-container');
 
if (regular === 'No') {
container.classList.remove('hidden');
} else {
container.classList.add('hidden');
}
}
 
function loadFlavours() {
const flavours =
JSON.parse(localStorage.getItem('savedFlavours') || '[]');
 
const datalist =
document.getElementById('flavour-list');
 
datalist.innerHTML =
flavours.map(f => `<option value="${f}">`).join('');
}
 
function saveFlavour(flavour) {
 
if (!flavour) return;
 
let flavours =
JSON.parse(localStorage.getItem('savedFlavours') || '[]');
 
if (!flavours.includes(flavour)) {
flavours.push(flavour);
 
localStorage.setItem(
'savedFlavours',
JSON.stringify(flavours)
);
}
}
        function switchTab(tabName) {
            const tabs = ['logger', 'stats', 'finder'];
            tabs.forEach(t => {
                const content = document.getElementById(`tab-content-${t}`);
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tabName) {
                    content.classList.remove('hidden');
                    btn.className = "px-4 py-2 text-sm font-medium rounded-t-lg bg-slate-800 text-emerald-400 border-b-2 border-emerald-500 cursor-pointer";
                } else {
                    content.classList.add('hidden');
                    btn.className = "px-4 py-2 text-sm font-medium rounded-t-lg text-slate-400 hover:text-slate-200 cursor-pointer";
                }
            });

            if (tabName === 'stats') {
                loadDropRateStats();
            }
        }

        function generateCardSlots() {
            const count = parseInt(document.getElementById('card-count-select').value) || 5;
            const container = document.getElementById('slots-container');
            container.innerHTML = '';
            activeSlotsData = new Array(count).fill(null);

            for (let i = 0; i < count; i++) {
                const slotNum = i + 1;
                const slotDiv = document.createElement('div');
                slotDiv.className = "relative bg-slate-900 border border-slate-700/80 p-2.5 rounded space-y-1";
                slotDiv.innerHTML = `
                    <div class="flex justify-between items-center text-[11px] text-slate-400">
                        <span class="font-mono font-semibold text-slate-300">Card ${slotNum}</span>
                        <span id="slot-badge-${i}" class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800">Pending</span>
                    </div>
                    <input type="text" id="slot-input-${i}" oninput="searchCarsForSlot(${i})" placeholder="Search car name..." class="w-full bg-slate-800 border border-slate-700 rounded p-1.5 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <div id="slot-suggestions-${i}" class="absolute left-0 right-0 top-14 bg-slate-900 border border-slate-700 rounded shadow-xl max-h-60 overflow-y-auto hidden z-20"></div>
                `;
                container.appendChild(slotDiv);
            }
        }

        async function searchCarsForSlot(slotIndex) {
            const query = document.getElementById(`slot-input-${slotIndex}`).value.trim();
            const suggestions = document.getElementById(`slot-suggestions-${slotIndex}`);
            document.querySelectorAll('[id^="slot-suggestions-"]').forEach(el => {
if (el.id !== `slot-suggestions-${slotIndex}`) {
el.classList.add('hidden');
}
});

            if (query.length < 2) {
                suggestions.classList.add('hidden');
                return;
            }

            const { data, error } = await db
                .from('cars')
                .select('id, name, rarity, rq')
                .ilike('name', `%${query}%`)
                .limit(50);

            if (error || !data || data.length === 0) {
                suggestions.innerHTML = '<div class="p-2 text-xs text-slate-500">No matching cars</div>';
                suggestions.classList.remove('hidden');
                return;
            }

            suggestions.innerHTML = data.map(car => {
                const classes = getRarityClass(car.rarity);
                const safeName = car.name.replace(/'/g, "\\'");
                return `
                    <div onclick="selectCarForSlot(${slotIndex}, '${car.id}', '${safeName}', '${car.rarity}', ${car.rq})" 
                         class="p-2 hover:bg-slate-800 cursor-pointer text-xs flex justify-between items-center border-b border-slate-800 last:border-0">
                        <span class="text-slate-100 font-medium">${car.name}</span>
                        <span class="font-mono ${classes.text}">RQ ${car.rq} • ${car.rarity}</span>
                    </div>
                `;
            }).join('');

            suggestions.classList.remove('hidden');
        }

        function selectCarForSlot(slotIndex, id, name, rarity, rq) {
            activeSlotsData[slotIndex] = { id, name, rarity, rq };

            const input = document.getElementById(`slot-input-${slotIndex}`);
            input.value = `${name} (RQ ${rq})`;

            const badge = document.getElementById(`slot-badge-${slotIndex}`);
            const classes = getRarityClass(rarity);
            badge.textContent = rarity;
            badge.className = `text-[10px] font-mono px-1.5 py-0.5 rounded font-semibold ${classes.badge}`;

            document.getElementById(`slot-suggestions-${slotIndex}`).classList.add('hidden');

            const nextIndex = slotIndex + 1;
            const nextInput = document.getElementById(`slot-input-${nextIndex}`);
            if (nextInput) {
                nextInput.focus();
            }
        }

        async function submitPack() {
            const date = document.getElementById('date-pulled').value;
            const packType = document.getElementById('pack-type').value;
            const packSubtype = document.getElementById('pack-subtype').value;
if (!date) {
alert('Please select a date.');
return;
}
 
if (!packType) {
alert('Please select a pack type.');
return;
}
 
if (
document.getElementById('regular-pack').value === 'No' &&
!packSubtype.trim()
) {
alert('Please select or enter a collection flavour.');
return;
}
            if (
document.getElementById('regular-pack').value === 'Yes'
) {
document.getElementById('pack-subtype').value = 'Regular';
} else {
saveFlavour(packSubtype);
}
            const filledSlots = activeSlotsData.filter(item => item !== null);

            if (filledSlots.length === 0) {
                alert('Please select at least one car before submitting.');
                return;
            }

            const packGroupId = crypto.randomUUID();
const missingCard = activeSlotsData.find(card => !card);
 
if (missingCard !== undefined) {
alert('Please select a car for every card slot.');
return;
}
            const rowsToInsert = activeSlotsData.map((car, idx) => {
                if (!car) return null;
                return {
                    date: date,
                    pack_type: packType,
                    pack_subtype: packSubtype,
                    car_name: car.name,
                    car_rarity: car.rarity,
                    car_rq: car.rq,
                    car_id: car.id,
                    pack_group_id: packGroupId,
                    slot_number: idx + 1,
                    weight_tier: Math.ceil((activeSlotsData.length - idx) / (activeSlotsData.length / 5))
                };
            }).filter(Boolean);

            const { error } = await db.from('pulls').insert(rowsToInsert);

            if (error) {
                alert('Error submitting pack: ' + error.message);
            } else {
                generateCardSlots();
                loadPulls();
            }
        }

        async function loadDropRateStats() {
            const packType = document.getElementById('stats-pack-type').value;
            const statsContainer = document.getElementById('stats-display-container');

            const { data: pulls, error } = await db
                .from('pulls')
                .select('car_rarity, slot_number, pack_group_id')
                .eq('pack_type', packType);

            if (error || !pulls || pulls.length === 0) {
                statsContainer.innerHTML = `<div class="p-4 text-center text-slate-400 text-xs">No logged pulls found for ${packType}.</div>`;
                return;
            }

            const packGroups = {};
            pulls.forEach(p => {
                const gid = p.pack_group_id || ('single_' + Math.random());
                if (!packGroups[gid]) packGroups[gid] = [];
                packGroups[gid].push(p);
            });

            let topSlotPulls = [];
            Object.values(packGroups).forEach(group => {
                const maxSlot = Math.max(...group.map(g => g.slot_number || 1));
                const topCard = group.find(g => (g.slot_number || 1) === maxSlot);
                if (topCard) topSlotPulls.push(topCard);
            });

            const totalPacks = topSlotPulls.length;
            const totalCards = pulls.length;

            const rarityCounts = {
                'Legendary': 0,
                'Epic': 0,
                'Ultra Rare': 0,
                'Super Rare': 0,
                'Rare': 0,
                'Uncommon': 0,
                'Common': 0
            };

            topSlotPulls.forEach(p => {
                if (rarityCounts[p.car_rarity] !== undefined) {
                    rarityCounts[p.car_rarity]++;
                }
            });

            const packOdds = OFFICIAL_ODDS[packType] || {};

            let html = `
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-slate-900 p-4 rounded border border-slate-700">
                        <div class="text-xs text-slate-400">Total Packs Opened</div>
                        <div class="text-2xl font-bold font-mono text-emerald-400">${totalPacks}</div>
                    </div>
                    <div class="bg-slate-900 p-4 rounded border border-slate-700">
                        <div class="text-xs text-slate-400">Total Cards Logged</div>
                        <div class="text-2xl font-bold font-mono text-slate-100">${totalCards}</div>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Top Slot Drop Rates vs Official Odds</div>
            `;

            const rarities = ['Legendary', 'Epic', 'Ultra Rare', 'Super Rare', 'Rare', 'Uncommon', 'Common'];

            rarities.forEach(rarity => {
                const count = rarityCounts[rarity];
                const actualPct = totalPacks > 0 ? ((count / totalPacks) * 100).toFixed(1) : '0.0';
                const officialPct = packOdds[rarity] !== undefined ? `${packOdds[rarity]}%` : 'N/A';
                const classes = getRarityClass(rarity);

                html += `
                    <div class="bg-slate-900 p-3 rounded border border-slate-700 space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-medium text-xs ${classes.text}">${rarity}</span>
                            <span class="font-mono text-xs text-slate-200">${count} pulled (${actualPct}%)</span>
                        </div>
                        <div class="flex justify-between items-center text-[11px] text-slate-400 font-mono">
                            <span>Official Top Slot Odds:</span>
                            <span class="text-slate-300">${officialPct}</span>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            statsContainer.innerHTML = html;
        }

        async function searchFlavourPulls() {
            const query = document.getElementById('flavour-search-input').value.trim();
            const container = document.getElementById('flavour-results-container');

            if (!query) {
                container.innerHTML = 'Enter a flavour above to analyse pull counts across pack types.';
                return;
            }

            const { data, error } = await db
                .from('pulls')
                .select('pack_type, car_rarity')
                .ilike('pack_subtype', `%${query}%`);

            if (error) {
                container.innerHTML = `<span class="text-red-400">Error: ${error.message}</span>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<span class="text-slate-500">No logged pulls matching "${query}".</span>`;
                return;
            }

            const packCounts = {};
            data.forEach(pull => {
                const pack = pull.pack_type || 'Unknown';
                packCounts[pack] = (packCounts[pack] || 0) + 1;
            });

            let html = `
                <div class="mt-2 p-3 bg-slate-900 rounded border border-slate-700 space-y-2">
                    <div class="flex justify-between items-center text-xs font-semibold text-slate-300">
                        <span>Matching Flavour Logs:</span>
                        <span class="text-emerald-400 font-mono">${data.length} Total</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
            `;

            for (const [pack, count] of Object.entries(packCounts)) {
                html += `
                    <div class="flex justify-between bg-slate-800 p-2 rounded border border-slate-700/50">
                        <span class="text-slate-300">${pack}</span>
                        <span class="font-mono text-emerald-400 font-bold">${count}</span>
                    </div>
                `;
            }

            html += `</div></div>`;
            container.innerHTML = html;
        }

function formatDisplayDate(dateString) {
if (!dateString) return '';
 
const months = [
'Jan','Feb','Mar','Apr','May','Jun',
'Jul','Aug','Sep','Oct','Nov','Dec'
];
 
const date = new Date(dateString);
 
return `${date.getDate()}-${months[date.getMonth()]}-${date.getFullYear()}`;
}
        async function loadPulls() {
            const { data, error } = await db
                .from('pulls')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(12);

            const tbody = document.getElementById('pulls-table-body');

            if (error || !data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-slate-500">No logged pulls found</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(pull => {
                const classes = getRarityClass(pull.car_rarity);
                const rqDisplay = pull.car_rq ? pull.car_rq : '-';

                return `
                    <tr class="border-b border-slate-800">
                        <td class="p-2 whitespace-nowrap">${formatDisplayDate(pull.date)}</td>
                        <td class="p-2 whitespace-nowrap">${pull.pack_type}</td>
                        <td class="p-2 whitespace-nowrap">${pull.pack_subtype || '-'}</td>
                        <td class="p-2 font-medium text-slate-100">${pull.car_name || 'N/A'}</td>
                        <td class="p-2 font-mono ${classes.text}">${rqDisplay}</td>
                        <td class="p-2">
                            <span class="px-2 py-0.5 rounded text-[10px] font-semibold whitespace-nowrap inline-block ${classes.badge}">
                                ${pull.car_rarity || ''}
                            </span>
                        </td>
                        <td class="p-2 text-center">
                            <button onclick="deletePull(${pull.id})" class="text-slate-500 hover:text-red-400 font-bold px-1 transition" title="Delete Entry">
                                ✕
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
document.addEventListener('click', function(event) {
if (
!event.target.closest('[id^="slot-input-"]') &&
!event.target.closest('[id^="slot-suggestions-"]')
) {
document.querySelectorAll('[id^="slot-suggestions-"]').forEach(el => {
el.classList.add('hidden');
});
}
});
        generateCardSlots();
loadPulls();
loadFlavours();
toggleFlavourField();
    </script>
</body>
</html>
